services:
  # ── MongoDB (auth sessions + users) ──────────────────────
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── One-shot: seed demo user so the dashboard is testable ──
  seed:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command: >
      mongosh "mongodb://mongo:27017/quantai" --eval "
      db.users.replaceOne({user_id:'user_demo'}, {
        user_id:'user_demo', email:'demo@quantai.local', name:'Demo User',
        picture:'https://ui-avatars.com/api/?name=Demo+User&background=2f5bd6&color=fff',
        auth_provider:'email', is_verified:true,
        created_at:new Date(), last_login:new Date()
      }, {upsert:true});
      db.user_sessions.deleteMany({user_id:'user_demo'});
      db.user_sessions.insertOne({
        user_id:'user_demo', session_token:'demo_session_persistent',
        expires_at:new Date(Date.now()+7*24*60*60*1000), created_at:new Date()
      });
      print('seeded demo user: demo@quantai.local / session_token=demo_session_persistent');
      "

  # ── FastAPI backend (live-reload from bind-mounted source) ──
  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    volumes:
      - ./:/app
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=quantai
      - PYTHONUNBUFFERED=1
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             mkdir -p output &&
             uvicorn server:app --host 0.0.0.0 --port 8001 --reload"
    ports:
      - "8001"
    restart: unless-stopped

  # ── Vite dev server (live-reload, port 3000) ─────────────
  frontend:
    image: node:22
    working_dir: /app/frontend
    volumes:
      - ./:/app
    environment:
      - VITE_PROXY_TARGET=http://backend:8001
    depends_on:
      - backend
    command: sh -c "yarn install && yarn dev"
    ports:
      - "3000:3000"
    restart: unless-stopped
