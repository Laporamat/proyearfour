services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: quantix
      MONGO_INITDB_ROOT_PASSWORD: quantixpass
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      MONGO_URL: mongodb://quantix:quantixpass@mongo:27017/?authSource=admin
      DB_NAME: quantix
    depends_on:
      mongo:
        condition: service_healthy
    command: sh -c "pip install --no-cache-dir -r requirements.txt && exec uvicorn server:app --reload --host 0.0.0.0 --port 8001"

  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      BACKEND_URL: http://backend:8001
    depends_on:
      - backend
    command: sh -c "npm install && exec npm run start"
    ports:
      - "3000:3000"

volumes:
  mongo_data:
  frontend_node_modules:
